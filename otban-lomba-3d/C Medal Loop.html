<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}</style><script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script><title>Winners Loop C · Medal</title></head><body>
<!-- Winners loop C · Medal (v2: theatre backdrop — navy velvet curtains, pendant lamps, spot pools) — 8 s seamless loop. ?k=1|2|3 picks the class (default 1).
     Medal rocks on sin(2πt/8) and makes one full 360° turn per loop (numeral struck on both faces), a glint light sweeps
     across the type every 4 s, sparks on an 8 s period → t=8 ≡ t=0. -->
<script type="module">
import {THREE,PAL,makeRenderer,loadFont,text3D,lights,stage} from '/lib.js';
import {useStudioEnv,goldMat,GOLD,sparks,theaterBackdrop} from '/gold.js';
import {pick,HEADER} from '/winners.js';
const W8=pick(), LOOP=8, TAU=Math.PI*2;
const renderer=makeRenderer(document.body), scene=new THREE.Scene(); scene.background=new THREE.Color(PAL.navy);
useStudioEnv(renderer,scene,1.4);
const cam=new THREE.PerspectiveCamera(30,16/9,.1,100); cam.position.set(0,0,15); cam.lookAt(0,0,0);
lights(scene,{key:[-4,5,8],intensity:1.8,hemi:.4});
const stageSet=theaterBackdrop(scene);   // client request: theatre curtains + pendant lamps behind the medal
const fX=await loadFont('/assets/fonts/archivo-x-800.ttf'), fJ=await loadFont('/assets/fonts/jakarta-700.ttf');
const holder=new THREE.Group();holder.position.set(-4.3,-.1,0);scene.add(holder);
const medal=new THREE.Group();holder.add(medal);
const disc=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,.32,128),goldMat(GOLD.face,.3));disc.rotation.x=Math.PI/2;medal.add(disc);
[1,-1].forEach(side=>{           // both faces struck, so a full turn never shows a blank back
  const f=new THREE.Group();f.rotation.y=side>0?0:Math.PI;medal.add(f);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.05,.07,16,128),goldMat(GOLD.side,.25));ring.position.z=.17;f.add(ring);
  const num=text3D(fX,W8.num,{size:W8.num.length>2?1.35:1.9,depth:.12,mats:[goldMat(GOLD.face,.18),goldMat(GOLD.deep,.3)],bevel:.02});num.position.set(0,.15,.17);f.add(num);
  const kel=text3D(fJ,'KELAS',{size:.3,depth:.05,mats:goldMat(GOLD.deep,.3),bevel:0});kel.position.set(0,-1.35,.17);f.add(kel);
});
[-1,1].forEach(s=>{const rb=new THREE.Mesh(new THREE.BoxGeometry(.9,3.2,.05),new THREE.MeshStandardMaterial({color:s<0?'#F4F6FB':'#152657',roughness:.6}));rb.position.set(s*.55,3.4,-.3);rb.rotation.z=s*.22;holder.add(rb)});
const Wm=new THREE.MeshStandardMaterial({color:'#F4F6FB',roughness:.5}), G=[goldMat(),goldMat(GOLD.side,.35)];
const fit=(m,w)=>{const k=Math.min(1,w/m.userData.w);m.scale.set(k,k,1);return m};
const L=(m,x,y)=>{m.geometry.translate(m.userData.w/2,0,0);m.position.set(x,y,0);scene.add(m);return m};
L(fit(text3D(fJ,HEADER[0],{size:.2,depth:.02,mats:Wm,bevel:0}),6.6),-1.2,2.4);
L(text3D(fJ,HEADER[1],{size:.2,depth:.02,mats:goldMat(),bevel:0}),-1.2,2.0);
L(fit(text3D(fX,'JUARA',{size:1.1,depth:.3,mats:G,bevel:.02}),6.6),-1.3,.9);
L(fit(text3D(fX,W8.cls,{size:.4,depth:.12,mats:G,bevel:.01}),6.6),-1.25,-.2);
L(fit(text3D(fX,W8.name,{size:.34,depth:.06,mats:Wm,bevel:0}),6.6),-1.25,-1.15);
const glint=new THREE.PointLight('#fff1cf',0,5,1.4);scene.add(glint);
const sp=sparks(scene,90,5,[18,10,6]);
stage(renderer,scene,cam,t=>{
  // full turn per loop, eased so the struck face lingers toward camera (ease(0)=0, ease(1)=1 → seamless)
  const u=t/LOOP, e=u-Math.sin(u*TAU)/TAU;
  medal.rotation.y=-.35+e*TAU; holder.rotation.z=Math.sin(u*TAU)*.04; holder.position.y=-.1+Math.sin(u*TAU*2)*.08;
  const g=(t%4)/4; glint.position.set(-1.6+g*8.4,.6,1.6); glint.intensity=Math.sin(g*Math.PI)*22;
  sp(t,LOOP); stageSet(t,LOOP);
},LOOP);
</script></body></html>
