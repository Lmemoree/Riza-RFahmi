<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Direction A · Aurora</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<!--
  Direction A — "Aurora" (reference-faithful, re-coloured)
  Logic: closest to the client's reference (blurred light orbs + extended display type +
  letter-scatter reveals), but moved onto #1F3375. Warm amber orb = emission/heat,
  teal-green orb = the reduction target. Orbs drift slowly; text decodes letter by letter.
  This file is the hero keyframe (title moment, ~0:38 in the planned cut).
-->
<style>
  :root{
    --navy:#1F3375; --navy-deep:#0F1B47; --ink:#F4F6FB; --mute:#B7C2E6;
    --amber:#FFB25B; --teal:#5FE3C0; --ice:#BFE6FF;
  }
  html,body{margin:0;background:#000}
  .frame{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:radial-gradient(120% 90% at 60% 40%, var(--navy) 0%, var(--navy-deep) 78%);
    font-family:"Plus Jakarta Sans",sans-serif;color:var(--ink)}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen}
  .o1{width:620px;height:420px;left:980px;top:120px;transform:rotate(-28deg);
      background:radial-gradient(closest-side,#fff 0%,var(--ice) 35%,rgba(95,227,192,.55) 60%,transparent 100%);opacity:.75}
  .o2{width:520px;height:520px;left:1340px;top:540px;
      background:radial-gradient(closest-side,var(--amber) 0%,rgba(255,120,60,.55) 45%,transparent 100%);opacity:.55}
  .o3{width:260px;height:260px;left:860px;top:600px;
      background:radial-gradient(closest-side,var(--teal),transparent);opacity:.45}
  .grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay}
  .kicker{position:absolute;left:120px;top:280px;font:500 22px/1 "Unbounded";letter-spacing:.42em;color:var(--mute)}
  h1{position:absolute;left:112px;top:330px;margin:0;font:900 132px/0.92 "Unbounded";letter-spacing:-.01em;text-transform:uppercase}
  h1 .ghost{opacity:.22}
  .theme{position:absolute;left:120px;top:770px;width:1020px;font:500 34px/1.38 "Plus Jakarta Sans";color:var(--ink)}
  .theme b{font-weight:700;color:var(--teal)}
  .meta{position:absolute;right:120px;bottom:96px;text-align:right;font:700 24px/1.5 "Unbounded";letter-spacing:.12em}
  .meta span{display:block;font:500 18px/1.6 "Plus Jakarta Sans";letter-spacing:.24em;color:var(--mute)}
  .presenter{position:absolute;left:120px;bottom:96px;display:flex;align-items:center;gap:22px}
  .presenter img{height:74px}
  .presenter p{margin:0;font:500 16px/1.45 "Plus Jakarta Sans";letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
</style>
</head>
<body>
<div class="frame">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <svg class="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="kicker">RAKORWIL 2026</div>
  <h1>Rapat<br>Koordinasi<br>Wilayah</h1>
  <div class="theme">Sinergi Transportasi Antarmoda dan <b>Penurunan Emisi Gas Rumah Kaca</b> di Kawasan Bandar Udara</div>

  <div class="presenter">
    <img src="../assets/logos/kemenhub_key.png" alt="Kementerian Perhubungan">
    <p>Kantor Otoritas Bandar Udara<br>Wilayah V Makassar</p>
  </div>
  <div class="meta">MAKASSAR<span>SELASA, 20 OKTOBER 2026</span></div>
</div>
</body>
</html>
