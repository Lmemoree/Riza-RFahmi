<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banner Rakorwil 2026</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<!--
  Rakorwil 2026 backdrop — direction C "Contrail", merged theme (direction-approved.md), v2 with the intermodal illustration.
  Right: isometric ecosystem (assets/iso-hub.png, rendered from illustration/iso.html — our own low-poly model, client ref = flat
  isometric airport): terminal with rooftop solar, gates, tower, runway + departing aircraft with a green contrail, rail + train,
  road + buses, harbour + ship. Left: the theme; under it the four mode lanes (C's motif) run into the island at Makassar.
  1920×1080, ground #1F3375, logos top-left Kemenhub · DGCA · ICAO Council.
-->
<style>
  :root{--navy:#1F3375;--ink:#F4F6FB;--mute:#A9B8E4;--acc:#7BE0A1}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;color:var(--ink);font-family:"Plus Jakarta Sans",sans-serif;
    background:radial-gradient(ellipse 60% 70% at 72% 62%,#2A4596 0%,rgba(31,51,117,0) 70%),linear-gradient(160deg,#24398A 0%,var(--navy) 45%,#182A66 100%)}
  svg.full{position:absolute;inset:0}
  .logos{position:absolute;left:110px;top:64px;display:flex;align-items:center;gap:44px}
  .logos img{display:block}
  .ev{position:absolute;right:110px;top:78px;text-align:right;font:500 20px/1.5 "Plus Jakarta Sans";color:var(--mute)}
  .ev b{display:block;font:800 28px "Archivo";font-stretch:112%;letter-spacing:.01em;color:var(--ink);text-transform:uppercase}
  .kick{position:absolute;left:114px;top:258px;font:700 22px "Plus Jakarta Sans";letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
  .kick i{font-style:normal;color:var(--acc)}
  .theme{position:absolute;left:108px;top:302px;margin:0;font-family:Archivo;font-stretch:112%;font-weight:900;font-size:66px;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
  .theme .g{color:var(--acc)}
  .theme .dan{font:600 32px "Plus Jakarta Sans";font-stretch:100%;letter-spacing:0;text-transform:none;color:var(--mute);margin-left:18px;vertical-align:.3em}
  .theme .tail{display:block;margin-top:12px;font:600 36px "Plus Jakarta Sans";font-stretch:100%;letter-spacing:0;text-transform:none;color:var(--ink)}
  #iso{position:absolute;left:905px;top:212px;width:1010px;filter:drop-shadow(0 30px 40px rgba(8,16,48,.45))}
</style></head><body>
<div id="stage">
  <svg class="full" id="art" viewBox="0 0 1920 1080"></svg>
  <img id="iso" src="assets/iso-hub.png" alt="">
  <svg class="full" id="front" viewBox="0 0 1920 1080"></svg>
  <div class="logos">
    <img src="assets/logos/kemenhub.png" style="height:104px">
    <img src="assets/logos/dgca.png" style="height:64px">
    <img src="assets/logos/icao_council_dark.png" style="height:72px">
  </div>
  <div class="ev"><b>Makassar, 20 Oktober 2026</b>Kantor Otoritas Bandar Udara Wilayah V Makassar</div>
  <div class="kick">Rapat Koordinasi Wilayah Kerja <i>2026</i></div>
  <h1 class="theme">Sinergi Transportasi<br>Antarmoda<span class="dan">dan</span><br><span class="g">Penurunan Emisi<br>Gas Rumah Kaca</span><span class="tail">di Kawasan Bandar Udara</span></h1>
</div>
<script src="assets/data.js"></script>
<script src="assets/banner.js"></script>
<script>
const svg=document.getElementById('art');
// ghost Indonesia map, oversized and cropped
drawMap(el('g',{},svg),{x:-260,y:150,s:1.55,fill:'#FFFFFF'}); svg.lastChild.querySelector('path').setAttribute('fill-opacity','.045');
// four mode lanes from the left edge braid into one and run into the island's road/rail at its left tip (= Makassar hub)
const HUB=[916,655];
const guide=el('path',{d:`M120 930 C 420 940 700 860 ${HUB[0]} ${HUB[1]}`,fill:'none'},svg);
const L=guide.getTotalLength(), at=u=>guide.getPointAtLength(L*u);
const nrm=u=>{const a=at(Math.max(0,u-.002)),b=at(Math.min(1,u+.002));const dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy);return [-dy/m,dx/m]};
const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
[['ferry','#4FB3A6',-54],['bus','#F2C14E',-18],['train','#E8794A',18],['airplane','#8FD3FF',54]].forEach(([ic,col,off])=>{
  let d='';for(let i=0;i<=120;i++){const u=i/120,p=at(u),n=nrm(u),o=off*(1-smooth(u/.85));d+=(i?'L':'M')+(p.x+n[0]*o).toFixed(1)+' '+(p.y+n[1]*o).toFixed(1);}
  el('path',{d,fill:'none',stroke:col,'stroke-width':10,'stroke-linecap':'round'},svg);
  const p=at(0),n=nrm(0); el('circle',{cx:p.x+n[0]*off,cy:p.y+n[1]*off,r:22,fill:'#1F3375',stroke:col,'stroke-width':4},svg);
  icon(svg,ic,p.x+n[0]*off,p.y+n[1]*off,24,col);
});
// hub marker sits on top of the island image
const fr=document.getElementById('front');
el('circle',{cx:HUB[0],cy:HUB[1],r:16,fill:'#F4F6FB'},fr); el('circle',{cx:HUB[0],cy:HUB[1],r:30,fill:'none',stroke:'#F4F6FB','stroke-width':2,'stroke-opacity':.7},fr);
const hl=el('text',{x:HUB[0]-46,y:HUB[1]-40,fill:'#F4F6FB','font-family':'JetBrains Mono','font-size':19,'letter-spacing':'3','text-anchor':'middle'},fr); hl.textContent='MAKASSAR';
const img=document.getElementById('iso');
(img.complete?Promise.resolve():new Promise(r=>img.onload=r)).then(()=>{fit();window.__ready=true});
</script></body></html>
