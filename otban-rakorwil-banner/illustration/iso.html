<!doctype html><html lang="id"><head><meta charset="utf-8">
<title>Isometric intermodal hub</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script></head><body>
<!--
  Isometric "ekosistem antarmoda" for the Rakorwil 2026 banner (client ref: flat isometric airport illustration).
  Our own low-poly model, rendered with an orthographic iso camera to a transparent PNG (2400x1500) and composited into the banner.
  One island = one ecosystem: runway + departing aircraft, terminal with rooftop solar, gates, control tower,
  rail line + station with train, road with buses/cars feeding the terminal, harbour with ship + containers.
  The departing aircraft heads up-right (−z) so the banner's green contrail can continue from it.
  Serve the repo with `python3 -m http.server` and open /otban-rakorwil-banner/illustration/iso.html
-->
<script type="module">
import * as THREE from 'three';
const SC=+(new URLSearchParams(location.search).get('s')||1), W=2400*SC, H=1500*SC;   // ?s=2 → 4800x3000 for 4K output
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(W,H);r.setClearColor(0x000000,0);
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const VS=24.5, cam=new THREE.OrthographicCamera(-VS*W/H,VS*W/H,VS,-VS,-200,400);
cam.position.set(60,62,60);cam.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight('#ffffff','#5a6fae',1.25));
const sun=new THREE.DirectionalLight('#ffffff',2.1);sun.position.set(18,40,-6);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:120});sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;
scene.add(sun);
const M={};const mat=c=>M[c]||(M[c]=new THREE.MeshLambertMaterial({color:c}));
const C={white:'#F4F6FB',grey:'#D5DEEF',mid:'#9FB0D6',glass:'#2F6FD0',glassD:'#1F4FA8',red:'#E5483B',navy:'#1F3375',green:'#5DB87A',greenD:'#3E9A5E',
  yellow:'#F2C14E',ground:'#4F7BCB',groundSide:'#22397F',apron:'#6189D4',asphalt:'#2A3F80',water:'#35A6DE',waterSide:'#1B5C9C',rail:'#C9D3EA',trunk:'#7A5A3A',teal:'#4FB3A6',orange:'#E8794A',solar:'#18306E'};
function box(w,h,d,c,x,y,z,parent=scene,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y+h/2,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m}
function cyl(rt,rb,h,c,x,y,z,parent=scene,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function prism(pts,depth,c,parent){const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(...p)));const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false});g.translate(0,0,-depth/2);const m=new THREE.Mesh(g,mat(c));m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
const G=()=>{const g=new THREE.Group();scene.add(g);return g};

/* ---------- island: land, water, surfaces ---------- */
box(29,1.6,28,C.ground,-5.5,-1.6,0);           // main land x[-20,9]
box(11,1.6,10,C.ground,14.5,-1.6,9);          // land strip by the harbour x[9,20] z[4,14]
box(11,1.2,18,C.water,14.5,-1.6,-5,scene,false).material=new THREE.MeshLambertMaterial({color:C.water});  // harbour water, sits lower
// side colour for depth: thin darker skirt under everything
box(40.2,.5,28.2,C.groundSide,0,-2.1,0,scene,false);
const flat=(w,d,c,x,z,y=0)=>box(w,.04,d,c,x,y,z,scene,false);
flat(4,27,C.asphalt,-16,0);                                       // runway along z
for(let z=-12;z<=12;z+=2.4) flat(.22,1.2,C.white,-16,z,.05);       // centreline
[-1.4,-.7,.7,1.4].forEach(dx=>flat(.3,1.8,C.white,-16+dx,12.2,.05));
flat(16,9.5,C.apron,-4,-8,0);                                     // apron
flat(2.2,5,C.apron,-12.8,-8,0);                                   // taxiway to runway
flat(40,2.6,C.asphalt,0,10.2,0);                                  // road along x
for(let x=-19;x<=19;x+=2.2) flat(1.1,.14,C.white,x,10.2,.05);
flat(2.4,7.5,C.asphalt,-4,5.4,0);                                 // feeder road to terminal
flat(29.6,1.4,'#3B5498',-5.2,6.6,0);                              // rail ballast (line ends at the port: x 9.6)
[-.32,.32].forEach(dz=>flat(29.6,.12,C.rail,-5.2,6.6+dz,.06));
for(let x=-19.6;x<=9.2;x+=.8) flat(.14,1.1,'#6E7FAE',x,6.6,.03);
flat(9,1.2,C.grey,-3,5.1,.0).scale.y=6;                           // station platform (raised)
flat(40,2.2,C.green,0,12.9,0);                                    // grass verge at the front edge
flat(3,26,C.green,-12.9,-1,0).scale.x=.6;                         // grass between runway and apron
flat(2,14,'#8A98BF',8,-4.5,0);                                    // pier
/* ---------- terminal with glass front, rooftop solar, gates ---------- */
const T=G();T.position.set(-4,0,-.2);
box(16,3.2,5,C.white,0,0,0,T);
box(15.2,2.4,.2,C.glass,0,.4,2.52,T,false);                       // glass façade (front, +z)
for(let x=-7.2;x<=7.2;x+=1.2) box(.12,2.4,.24,C.white,x,.4,2.55,T,false);
box(.2,2.4,4.2,C.glass,8.02,.4,0,T,false);                        // glass side (+x)
box(17,.35,6,C.grey,0,3.2,0,T);                                   // roof slab with overhang
for(let i=0;i<6;i++)for(let j=0;j<2;j++){const p=box(2,.12,1.6,C.solar,-5.6+i*2.25,3.6,-1.1+j*2.1,T);p.rotation.x=-.18}
box(4,4.6,4,C.white,-9.5,0,-.5,T);box(3.4,3.4,.2,C.glass,-9.5,.6,1.52,T,false);   // side pavilion
// jet bridges to the gates
[-7.5,.5].forEach(x=>{box(.9,.9,3.4,C.grey,x,1.6,-4.2);box(.5,1.6,.5,C.mid,x,0,-5.6)});
/* ---------- control tower ---------- */
const TW=G();TW.position.set(-13.2,0,4.2);
cyl(.9,1.2,7.5,C.white,0,0,0,TW);cyl(1.9,1.4,.8,C.white,0,7.5,0,TW);cyl(1.8,1.8,1.3,C.glass,0,8.3,0,TW);cyl(2.1,2.1,.25,C.white,0,9.6,0,TW);
cyl(.06,.06,1.4,C.mid,.6,9.85,.2,TW,6);cyl(.06,.06,1,C.mid,-.5,9.85,-.3,TW,6);
/* ---------- aircraft ---------- */
function plane(tail=C.navy,s=1){const g=G();g.scale.setScalar(s);
  const f=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,8,24),mat(C.white));f.rotation.z=Math.PI/2;f.castShadow=true;g.add(f);
  const n=new THREE.Mesh(new THREE.SphereGeometry(.6,24,16),mat(C.white));n.scale.set(1.7,1,1);n.position.x=4;n.castShadow=true;g.add(n);
  const tc=new THREE.Mesh(new THREE.ConeGeometry(.6,2.4,24),mat(C.white));tc.rotation.z=Math.PI/2;tc.position.set(-5.2,.12,0);tc.castShadow=true;g.add(tc);
  box(6.2,.12,1.22,C.glassD,-.2,.12,0,g,false);                                     // window band
  const ck=box(.5,.22,1.0,C.navy,4.55,.16,0,g,false);ck.rotation.z=-.5;            // cockpit glazing
  const wing=prism([[1.4,.6],[-1.6,6.2],[-2.5,6.2],[-1,.6],[-1,-.6],[-2.5,-6.2],[-1.6,-6.2],[1.4,-.6]],.14,C.white,g);wing.rotation.x=Math.PI/2;wing.position.y=-.2;
  const hs=prism([[-4.6,.3],[-5.9,2.5],[-6.5,2.5],[-6.1,.3],[-6.1,-.3],[-6.5,-2.5],[-5.9,-2.5],[-4.6,-.3]],.1,C.white,g);hs.rotation.x=Math.PI/2;hs.position.y=.3;
  prism([[-3.8,.4],[-5.9,3.1],[-6.7,3.1],[-6.2,.4]],.14,tail,g);
  [-2.4,2.4].forEach(z=>{const e=new THREE.Mesh(new THREE.CylinderGeometry(.36,.32,1.5,20),mat(C.grey));e.rotation.z=Math.PI/2;e.position.set(.3,-.55,z);e.castShadow=true;g.add(e)});
  return g}
const p1=plane(C.navy);p1.position.set(-7.5,1.05,-8.4);p1.rotation.y=-Math.PI/2;      // parked, nose to the terminal
const p2=plane(C.red);p2.position.set(.5,1.05,-8.4);p2.rotation.y=-Math.PI/2;
const p3=plane(C.navy,1.05);p3.position.set(-16,8.5,-15.5);p3.rotation.order='YZX';p3.rotation.set(0,Math.PI/2,.22);  // departing up-right (−z), nose up
/* ---------- train at the station ---------- */
function car(x,lead,dir=1){const g=G();g.position.set(x,.15,6.6);
  if(lead){const m=prism([[0,0],[5,0],[5,.55],[4.1,1.45],[0,1.45]],1.2,C.white,g);m.position.x=-2.5;if(dir<0){g.rotation.y=Math.PI}
    const st=prism([[0,.35],[5.02,.35],[5.02,.6],[0,.6]],1.24,C.red,g);st.position.x=-2.5;const wn=prism([[.3,.85],[4.2,.85],[3.95,1.15],[.3,1.15]],1.24,C.glassD,g);wn.position.x=-2.5}
  else{box(5,1.45,1.2,C.white,0,0,0,g);box(5.02,.25,1.24,C.red,0,.35,0,g,false);box(4.4,.3,1.24,C.glassD,0,.85,0,g,false)}
  return g}
car(3.3,true);car(-1.9,false);car(-7.1,true,-1);
/* ---------- buses and cars on the road ---------- */
function bus(x,z,rot=0,c=C.red){const g=G();g.position.set(x,0,z);g.rotation.y=rot;box(3.4,1.25,1.1,C.white,0,.15,0,g);box(3.42,.3,1.12,c,0,.15,0,g,false);box(3.0,.38,1.14,C.glassD,0,.75,0,g,false);
  [-1.1,1.1].forEach(dx=>[-.56,.56].forEach(dz=>{const w=cyl(.2,.2,.12,'#1b2240',dx,0,dz,g,12);w.rotation.x=Math.PI/2;w.position.y=.2}));return g}
function auto(x,z,c,rot=0){const g=G();g.position.set(x,0,z);g.rotation.y=rot;box(1.8,.45,.9,c,0,.12,0,g);box(1,.38,.8,C.glassD,-.1,.57,0,g,false);return g}
bus(-12,9.6);bus(7,10.8,Math.PI,C.teal);bus(-4,7.9-3.6,Math.PI/2);auto(1,9.6,C.red);auto(13,9.6,C.yellow);auto(-17,10.8,C.white,Math.PI);
/* ---------- harbour: ship + containers ---------- */
const S=G();S.position.set(13.8,-.55,-5);S.rotation.y=Math.PI/2;
prism([[-6,0],[5.2,0],[6.6,1.5],[-6,1.5]],3,C.navy,S);prism([[-6,0],[5.2,0],[5.5,.4],[-6,.4]],3.04,C.red,S);
box(2.4,2.6,2.6,C.white,-4.4,1.5,0,S);box(2.6,.25,2.8,C.grey,-4.4,4.1,0,S);box(2.2,.5,2.64,C.glassD,-4.4,3.3,0,S,false);cyl(.35,.35,1.2,C.red,-5,4.35,0,S,12);
const CC=[C.red,C.teal,C.yellow,C.orange,C.glass,C.green];
for(let i=0;i<4;i++)for(let j=0;j<2;j++)for(let k=0;k<(i%2?2:1);k++) box(1.9,.8,1.25,CC[(i*2+j+k)%6],-1.6+i*1.95,1.5+k*.8,-.66+j*1.32,S);
for(let i=0;i<3;i++)for(let k=0;k<2;k++) box(1.25,.8,1.9,CC[(i+k+2)%6],8.2,k*.8,-10+i*2.1);
const crane=G();crane.position.set(8.3,0,-3.5);box(.25,5,.25,C.yellow,-.6,0,-.6,crane);box(.25,5,.25,C.yellow,.6,0,-.6,crane);box(.25,5,.25,C.yellow,-.6,0,.6,crane);box(.25,5,.25,C.yellow,.6,0,.6,crane);box(6.5,.35,.5,C.yellow,2.4,5,0,crane);
/* ---------- trees ---------- */
function tree(x,z,s=1){cyl(.12*s,.15*s,.7*s,C.trunk,x,0,z,scene,8);const t=new THREE.Mesh(new THREE.SphereGeometry(.75*s,10,8),mat(C.greenD));t.position.set(x,1.25*s,z);t.castShadow=true;scene.add(t)}
for(let x=-19;x<=19;x+=2.6) tree(x,12.9+(x%2?.4:-.3),.9+((x*7)%3)*.1);
[[-13,-13],[-12.6,-1],[-12.7,8.2],[6,-12.5],[2.5,-12.6],[17,12.8],[11,4.8]].forEach(([x,z])=>tree(x,z,1));
/* ---------- contrail: from the runway up to the departing aircraft; dots shrink and turn green (emisi ↓) ---------- */
{const g0=new THREE.Color('#C9D3EA'),g1=new THREE.Color('#7BE0A1'),N=46;
 for(let i=0;i<N;i++){const t=i/(N-1),z=4-(4+9.2)*t,y=.45+6.5*t*t;const m=new THREE.Mesh(new THREE.SphereGeometry(.34-.22*t,12,8),new THREE.MeshBasicMaterial({color:g0.clone().lerp(g1,t)}));m.position.set(-16,y,z);scene.add(m)}}
/* ---------- penurunan emisi: offshore wind, solar-canopy EV bus depot, (rooftop solar + green contrail above) ---------- */
box(.5,.7,1.6,C.grey,9.9,0,6.6);                                   // rail buffer stop
function turbine(x,z,h,yaw){const g=G();g.position.set(x,0,z);
  cyl(.9,1.1,.9,C.yellow,0,-.9,0,g,16);cyl(.18,.34,h,C.white,0,0,0,g,16);
  const head=new THREE.Group();head.position.y=h;head.rotation.y=yaw;g.add(head);
  box(1.3,.5,.55,C.white,-.2,-.25,0,head);const hub=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),mat(C.white));hub.position.x=.55;head.add(hub);
  for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.1,h*.48,.34),mat(C.white));b.geometry.translate(0,h*.24,0);b.position.x=.62;b.rotation.x=i*2*Math.PI/3+.35;b.castShadow=true;head.add(b)}
  return g}
turbine(18.2,-12.6,9.5,-Math.PI/4);turbine(18.4,-6.8,8.4,-Math.PI/4);turbine(18.6,-1.2,7.4,-Math.PI/4);   // rotor faces the iso camera
// EV bus depot under a solar canopy, on the land strip by the port
const dep=G();dep.position.set(14.6,0,6.6);
flat(9.6,4.2,'#3D63B5',14.6,6.6,.02);
for(let i=0;i<3;i++) for(const dz of [-1.7,1.7]) box(.18,2.6,.18,C.grey,-3.6+i*3.6,0,dz,dep);
for(let i=0;i<5;i++) for(let j=0;j<3;j++){const p=box(1.8,.1,1.15,C.solar,-3.7+i*1.85,2.62,-1.2+j*1.2,dep);p.rotation.x=-.12}
function ebus(x,z){const g=G();g.position.set(x,0,z);box(3.4,1.25,1.1,C.white,0,.15,0,g);box(3.42,.3,1.12,C.green,0,.15,0,g,false);box(3.0,.38,1.14,C.glassD,0,.75,0,g,false);box(.9,.12,.6,C.green,.4,1.4,0,g,false);
  [-1.1,1.1].forEach(dx=>[-.56,.56].forEach(dz=>{const w=cyl(.2,.2,.12,'#1b2240',dx,0,dz,g,12);w.rotation.x=Math.PI/2;w.position.y=.2}));return g}
ebus(12.4,5.7);ebus(16.6,7.5);
[[10.6,5.7],[14.8,7.5]].forEach(([x,z])=>{box(.35,1.1,.35,C.white,x,0,z);box(.37,.25,.37,C.green,x,1.1,z)});
// screen anchors for the banner's callouts (pixel coords in this render)
const proj=v=>{const p=new THREE.Vector3(...v).project(cam);return [Math.round((p.x+1)/2*W),Math.round((1-p.y)/2*H)]};
r.render(scene,cam);cam.updateMatrixWorld();
window.__anchors={wind:proj([18.4,9.6,-6.8]),depot:proj([14.6,2.8,6.6]),roof:proj([-4,3.8,-.2]),contrail:proj([-16,4.3,-6])};
window.__ready=true;
</script></body></html>
