<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<title>3D A · Paper Tunnel</title></head><body>
<!-- Direction A "Paper Tunnel": the reference's grammar (stacked cut-paper rings, camera dolly through clouds)
     recoloured into the event palette. Rings = layers of the sky; small paper planes orbit the rings;
     the innermost cream disc is the title plate. Hero still = title lock-up. -->
<script type="module">
import {THREE,PAL,rng,makeRenderer,paperMat,mesh,extrude,ringShape,cloudShape,planeMesh,loadFont,text3D,lights,stage} from '/lib.js';
const renderer=makeRenderer(document.body), scene=new THREE.Scene(); scene.background=new THREE.Color(PAL.navyDeep);
const cam=new THREE.PerspectiveCamera(38,16/9,.1,200); cam.position.set(0,0,9);
lights(scene,{key:[2.5,4,12],intensity:2.6,shadowBox:9});
const RINGS=[ // [rOut,rIn,kind,teeth,amp,color] — nearest first; restrained palette: navy family + 1 amber + 1 coral + green core
 [12,4.3,'scallop',18,.42,PAL.navy],[11,3.95,'zigzag',30,.30,PAL.navyDeep],[10,3.65,'scallop',24,.26,PAL.coral],
 [9,3.38,'wave',22,.22,PAL.navyMid],[8,3.12,'zigzag',40,.20,PAL.amber],[7,2.9,'scallop',30,.17,PAL.navy],
 [6,2.72,'plain',1,0,PAL.blue],[5.5,2.56,'scallop',36,.13,PAL.sky],[5,2.42,'zigzag',52,.11,PAL.green],
];
RINGS.forEach(([ro,ri,k,n,a,c],i)=>{const m=mesh(extrude(ringShape(ro,ri,k,n,a,i*.3),.05),paperMat(c));m.position.z=-2.6-i*.42;scene.add(m)}); // big rings near, small far = tunnel depth
const disc=mesh(new THREE.CylinderGeometry(3,3,.06,96),paperMat(PAL.cream));disc.rotation.x=Math.PI/2;disc.position.z=-6.2;scene.add(disc);
const back=mesh(new THREE.PlaneGeometry(40,30),paperMat(PAL.navyDeep));back.position.z=-6.4;scene.add(back);
// clouds framing the lens
[[-7.4,-3.5,0,1],[7.3,-3.8,0,2],[-7.9,4.0,Math.PI,3],[7.7,4.2,Math.PI,4]].forEach(([x,y,r,s],i)=>{
  const m=mesh(extrude(cloudShape(7,3,s,5),.06),paperMat(i%2?PAL.cream:'#E6E2D6'));m.position.set(x,y,-1.6+i*.08);m.rotation.z=r;scene.add(m)});
// paper planes orbiting
[[0.3,3.0,-3.0],[2.4,3.25,-4.2],[4.1,2.9,-2.6]].forEach(([a,r,z])=>{const p=planeMesh(PAL.paper);p.scale.setScalar(.55);p.traverse(o=>o.castShadow=false);
  p.position.set(Math.cos(a)*r,Math.sin(a)*r,z);p.rotation.z=a+Math.PI/2;scene.add(p)});
const font=await loadFont('/assets/fonts/archivo-x-800.ttf'), fj=await loadFont('/assets/fonts/jakarta-700.ttf');
// title plate: auto-fit lines to the visible disc (inner hole r≈2.3 → keep text ≤ 3.4 wide)
const fit=(m,w)=>{const k=Math.min(1,w/m.userData.w);m.scale.set(k,k,1);return m};
const t1=fit(text3D(font,'RAPAT KOORDINASI',{size:.26,depth:.05,color:PAL.navy}),3.4);t1.position.set(0,.3,-6.1);scene.add(t1);
const t2=fit(text3D(font,'WILAYAH',{size:.26,depth:.05,color:PAL.navy}),3.4);t2.position.set(0,-.08,-6.1);scene.add(t2);
const t3=fit(text3D(fj,'MAKASSAR  ·  20 OKTOBER 2026',{size:.1,depth:.02,color:PAL.greenDeep}),2.6);t3.position.set(0,-.55,-6.12);scene.add(t3);
stage(renderer,scene,cam,t=>{},10);
</script></body></html>
