<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<title>3D C · Type Monument</title></head><body>
<!-- Direction C "Type Monument": the title itself is the 3D set — thick extruded letters standing on a navy
     apron like terminal signage, low camera, raking warm light; a plane passes overhead and its shadow sweeps
     across the letters. Camera orbits slowly. Hero still = low 3/4 view with the plane shadow on the letters. -->
<script type="module">
import {THREE,PAL,makeRenderer,paperMat,mesh,extrude,cloudShape,planeMesh,loadFont,text3D,lights,stage} from '/lib.js';
const renderer=makeRenderer(document.body), scene=new THREE.Scene(); scene.background=new THREE.Color(PAL.navy);
scene.fog=new THREE.Fog(PAL.navy,22,48);
const cam=new THREE.PerspectiveCamera(30,16/9,.1,200); cam.position.set(-3.6,5.2,16.5); cam.lookAt(-.9,.9,-1.8);
const key=lights(scene,{key:[-7,9,6],intensity:3.0,shadowBox:12,hemi:.7});
const ground=mesh(new THREE.PlaneGeometry(80,80),paperMat(PAL.navyDeep));ground.rotation.x=-Math.PI/2;scene.add(ground);
// apron markings: thin green line leading into the type (taxi line)
const line=mesh(new THREE.PlaneGeometry(.12,30),paperMat(PAL.green));line.rotation.x=-Math.PI/2;line.rotation.z=.12;line.position.set(-3.6,.005,8);scene.add(line);
const font=await loadFont('/assets/fonts/archivo-x-800.ttf'), fj=await loadFont('/assets/fonts/jakarta-700.ttf');
// two rows of standing letters: back row RAPAT KOORDINASI, front row WILAYAH + date sign
const L1=text3D(font,'RAPAT KOORDINASI',{size:.82,depth:.8,color:PAL.paper,side:PAL.navyMid,bevel:.02});L1.position.set(0,L1.userData.h/2,-3.8);scene.add(L1);
const L2=text3D(font,'WILAYAH',{size:.82,depth:.8,color:PAL.green,side:PAL.greenDeep,bevel:.02});L2.position.set(-(L1.userData.w-L2.userData.w)/2,L2.userData.h/2,0);scene.add(L2);
const d=text3D(fj,'MAKASSAR · 20 OKTOBER 2026',{size:.3,depth:.08,color:PAL.paper,side:PAL.navyMid});
d.position.set(L2.position.x+L2.userData.w/2+.6+d.userData.w/2,d.userData.h/2+.02,.3);scene.add(d);
const plane=planeMesh(PAL.paper,.06);plane.scale.setScalar(3.2);plane.rotation.set(-.55,.15,.38);plane.position.set(3.0,4.2,-.5);scene.add(plane);
[[-13,.9,-32,1],[13,1.1,-34,2],[0,1.4,-38,3]].forEach(([x,y,z,s])=>{const c=mesh(extrude(cloudShape(9,1.8,s,5),.1),paperMat(PAL.cream,{fog:false}));c.position.set(x,y,z);c.castShadow=false;scene.add(c)});
stage(renderer,scene,cam,t=>{},10);
</script></body></html>
