<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<title>3D B · Paper Diorama</title></head><body>
<!-- Direction B "Paper Diorama": a side-on cut-paper landscape of the intermodal hub — sea with a ship, a rail line,
     a road with a bus, the runway with a plane taking off — stacked in depth so the camera can truck sideways
     with real parallax. Title floats in the sky as thick card. Hero still = all modes in one frame. -->
<script type="module">
import {THREE,PAL,rng,makeRenderer,paperMat,mesh,extrude,stripShape,cloudShape,planeMesh,loadFont,text3D,lights,stage} from '/lib.js';
const renderer=makeRenderer(document.body), scene=new THREE.Scene(); scene.background=new THREE.Color(PAL.navy);
const cam=new THREE.PerspectiveCamera(32,16/9,.1,200); cam.position.set(0,.4,21); cam.lookAt(0,.4,0);
lights(scene,{key:[-1.2,2.2,16],intensity:2.4,shadowBox:14});
const sky=mesh(new THREE.PlaneGeometry(70,40),paperMat(PAL.navy));sky.position.z=-4;scene.add(sky);
const sun=mesh(new THREE.CircleGeometry(1.1,64),paperMat(PAL.amber));sun.position.set(-5.6,.4,-3.9);scene.add(sun);
const L=(shape,color,y,z)=>{const m=mesh(extrude(shape,.06),paperMat(color));m.position.set(0,y,z);scene.add(m);return m};
L(cloudShape(30,1.5,7,9),'#2C4A9E',.2,-3.5);                                  // far cloud band
L(stripShape(34,6,'hills',6,.9,2),PAL.navyMid,-1.2,-3.0);                      // far hills
L(stripShape(34,6,'wave',26,.14,1),PAL.teal,-2.0,-2.5);                       // sea
L(stripShape(34,6,'wave',34,.10,3),'#3E9E93',-2.35,-2.2);                     // sea front wave
L(stripShape(34,6,'plain',1,0,0),PAL.navyDeep,-2.9,-1.8);                      // rail embankment
L(stripShape(34,6,'plain',1,0,0),'#2B3A6E',-3.5,-1.3);                        // road
L(stripShape(34,6,'scallop',40,.10,4),PAL.green,-4.1,-.8);                     // grass verge
L(stripShape(34,6,'plain',1,0,0),'#26305A',-4.6,-.4);                         // runway
// runway centreline dashes
for(let i=-12;i<=12;i++){const d=mesh(new THREE.BoxGeometry(.5,.05,.02),paperMat(PAL.paper));d.position.set(i*1.1,-4.95,-.33);scene.add(d)}
// pictogram vehicles (flat cut card)
const shp=(pts)=>{const s=new THREE.Shape();pts.forEach(([x,y],i)=>i?s.lineTo(x,y):s.moveTo(x,y));return s};
const ship=new THREE.Group();ship.add(mesh(extrude(shp([[-1.1,0],[1.2,0],[1.5,.45],[-1.3,.45]]),.05),paperMat(PAL.paper)));
ship.add(mesh(extrude(shp([[-.6,.45],[.5,.45],[.5,.85],[-.6,.85]]),.05),paperMat(PAL.paper)));
ship.add(mesh(extrude(shp([[-.1,.85],[.15,.85],[.15,1.15],[-.1,1.15]]),.05),paperMat(PAL.coral)));
ship.position.set(-5.2,-2.05,-2.3);ship.scale.setScalar(.8);scene.add(ship);
const train=new THREE.Group();[0,1.45,2.9].forEach((x,i)=>{const s=new THREE.Shape();s.moveTo(x,0);s.lineTo(x+1.35,0);s.lineTo(x+1.35,.5);if(i===2){s.lineTo(x+1.0,.5);s.quadraticCurveTo(x+1.35,.5,x+1.35,.1)};s.lineTo(x+1.35,.55);s.lineTo(x,.55);
  train.add(mesh(extrude(s,.05),paperMat(PAL.paper)));for(let w=0;w<3;w++)train.add(mesh(new THREE.BoxGeometry(.22,.16,.02),paperMat(PAL.navy)).translateX(x+.3+w*.38).translateY(.33).translateZ(.06))});
train.position.set(1.2,-2.92,-1.7);train.scale.setScalar(.75);scene.add(train);
const bus=new THREE.Group();bus.add(mesh(extrude(shp([[0,.1],[1.6,.1],[1.6,.75],[0,.75]]),.05),paperMat(PAL.amber)));
[.35,1.25].forEach(x=>bus.add(mesh(new THREE.CylinderGeometry(.13,.13,.06,24),paperMat(PAL.navyDeep)).rotateX(Math.PI/2).translateX(x).translateZ(-.1)));
for(let w=0;w<3;w++)bus.add(mesh(new THREE.BoxGeometry(.32,.2,.02),paperMat(PAL.navy)).translateX(.3+w*.45).translateY(.52).translateZ(.06));
bus.position.set(-1.6,-3.52,-1.2);bus.scale.setScalar(.75);scene.add(bus);
const plane=planeMesh(PAL.paper,.05);plane.scale.setScalar(2.2);plane.rotation.z=.32;plane.position.set(5.8,-.6,.3);scene.add(plane);
// contrail of small green cards (emission ↓ = fading)
for(let i=1;i<9;i++){const c=mesh(new THREE.CircleGeometry(.07,16),paperMat(PAL.green,{transparent:true,opacity:1-i/9}));c.position.set(5.8-1.1-i*.42,-.6-.36-i*.14,.25);scene.add(c)}
L(cloudShape(9,1.4,5,5),PAL.cream,5.6,-1.0).position.x=-10.5; L(cloudShape(8,1.2,9,4),'#E6E2D6',5.9,-.6).position.x=11;
const font=await loadFont('/assets/fonts/archivo-x-800.ttf'), fj=await loadFont('/assets/fonts/jakarta-700.ttf');
const fit=(m,w)=>{const k=Math.min(1,w/m.userData.w);m.scale.set(k,k,1);return m};
const t1=fit(text3D(font,'RAPAT KOORDINASI WILAYAH',{size:.9,depth:.22,color:PAL.paper,side:PAL.navyDeep}),15);t1.position.set(0,3.4,0);t1.castShadow=false;scene.add(t1);
const t2=text3D(fj,'MAKASSAR  ·  SELASA, 20 OKTOBER 2026',{size:.26,depth:.05,color:PAL.green});t2.position.set(0,2.2,0);t2.castShadow=false;scene.add(t2);
stage(renderer,scene,cam,t=>{},10);
</script></body></html>
